# Hermes Agent — default config for the Railway all-in-one deployment.
#
# This file is seeded into ~/.hermes/config.yaml on first boot only.
# Once present, your edits stick — this template is NEVER re-applied on
# redeploy. Edit your live config from:
#   - Hermes Control Center → Preferences (in the WebUI), or
#   - SSH into the container: /home/hermeswebui/.hermes/config.yaml
#
# Secrets (TELEGRAM_BOT_TOKEN, DISCORD_BOT_TOKEN, *_API_KEY, ...) belong in
# Railway environment variables. Do NOT put them in this file.

# ─────────────────────────────────────────────────────────────────────────
# Model & provider
# ─────────────────────────────────────────────────────────────────────────
model:
  # Override with `/model <provider:name>` in chat, or HERMES_INFERENCE_PROVIDER.
  default: "anthropic/claude-opus-4.6"
  # "auto" picks the first matching credential found in the Railway env
  # (ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, GOOGLE_API_KEY, ...).
  provider: "auto"

# ─────────────────────────────────────────────────────────────────────────
# Agent behavior
# ─────────────────────────────────────────────────────────────────────────
agent:
  max_turns: 60
  reasoning_effort: "medium"
  verbose: false

# ─────────────────────────────────────────────────────────────────────────
# Memory & nudges
# ─────────────────────────────────────────────────────────────────────────
memory:
  # Remind the agent to save memories every N user turns. 0 disables.
  nudge_interval: 10
  # Give the agent one turn to flush memories on context loss (compress / reset / exit).
  flush_min_turns: 6

# ─────────────────────────────────────────────────────────────────────────
# Skills
# ─────────────────────────────────────────────────────────────────────────
skills:
  # Nudge the agent to create a skill every N tool-calling iterations.
  creation_nudge_interval: 15

# ─────────────────────────────────────────────────────────────────────────
# Session reset (Telegram, Discord, WhatsApp, Slack, ...)
# Keeps long-running messaging sessions from growing unboundedly.
# ─────────────────────────────────────────────────────────────────────────
session_reset:
  mode: both          # reset on EITHER idle timeout OR daily boundary
  idle_minutes: 1440  # 24h of inactivity → fresh session
  at_hour: 4          # daily reset at 04:00 local time

# In a group/channel, give each user their own session (recommended).
# Prevents context bleed and cost sharing between users in the same room.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/messaging/discord
group_sessions_per_user: true

# ─────────────────────────────────────────────────────────────────────────
# Per-platform toolsets — curated presets define what tools the agent has
# on each platform (terminal, file, web, vision, image_gen, tts, browser,
# skills, todo, cronjob, send_message, messaging).
# ─────────────────────────────────────────────────────────────────────────
platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  discord: [hermes-discord]

# ─────────────────────────────────────────────────────────────────────────
# Telegram — top-level config block.
#
# Required env vars (set in Railway):
#   TELEGRAM_BOT_TOKEN      — token from @BotFather → /newbot
#   TELEGRAM_ALLOWED_USERS  — comma-separated numeric user IDs (e.g. 123456789)
#
# Recommended for Railway (lets the service sleep when idle instead of
# long-polling Telegram 24/7):
#   TELEGRAM_WEBHOOK_URL    — https://<your-public-domain>/telegram
#   TELEGRAM_WEBHOOK_SECRET — `openssl rand -hex 32` — REQUIRED whenever
#                             TELEGRAM_WEBHOOK_URL is set (security advisory
#                             GHSA-3vpc-7q5r-276h).
#
# BotFather privacy mode is ON by default → the bot only sees /commands and
# replies in groups. Turn it OFF via @BotFather → /mybots → Bot Settings →
# Group Privacy, then REMOVE AND RE-ADD the bot to existing groups so the
# new privacy state takes effect.
# ─────────────────────────────────────────────────────────────────────────
telegram:
  # In groups, only respond to: @mentions, replies to the bot, /command@bot,
  # or messages matching mention_patterns below. DMs always get a response.
  require_mention: true

  # Bot reaction lifecycle (👀 starting → ✅ done / ❌ error). Off by default
  # on Telegram (replaces atomically; some servers find it noisy).
  reactions: false

  # Auto-format markdown tables for Telegram's MarkdownV2 (small → bullets,
  # large → fenced code block). Set false to keep the legacy code-block-only
  # behavior.
  pretty_tables: true

  # Optional wake-word regexes for groups (Python regex, case-insensitive).
  # Anchor with ^ if you only want to match the start of a message.
  # mention_patterns:
  #   - "^\\s*hermes\\b"

  # Forum topics to silently ignore. Accepts ints or strings.
  # ignored_threads: []

  # Per-chat / per-topic ephemeral system prompts (chat_id → prompt text).
  # channel_prompts: {}

# ─────────────────────────────────────────────────────────────────────────
# Discord — top-level config block.
#
# Required env vars (set in Railway):
#   DISCORD_BOT_TOKEN       — token from https://discord.com/developers/applications
#   DISCORD_ALLOWED_USERS   — comma-separated Discord user IDs (Settings →
#                             Advanced → Developer Mode → right-click user →
#                             Copy User ID).
#   DISCORD_ALLOWED_ROLES   — alternative to user IDs; auto-enables the
#                             Server Members Intent.
#
# In the Discord Developer Portal → Bot → Privileged Gateway Intents, you
# MUST enable BOTH:
#   - Message Content Intent  (without this the bot sees empty messages)
#   - Server Members Intent   (required if you use DISCORD_ALLOWED_ROLES)
#
# Invite URL permissions integer: 274878286912 (View Channels, Send Messages,
# Embed Links, Attach Files, Read Message History, Send Messages in Threads,
# Add Reactions).
# ─────────────────────────────────────────────────────────────────────────
discord:
  # In server channels: only respond to @mentions. DMs always get a response.
  # Override via env DISCORD_REQUIRE_MENTION or DISCORD_FREE_RESPONSE_CHANNELS.
  require_mention: true

  # Auto-create a new thread for each @mention in a text channel — keeps the
  # parent channel clean and gives each conversation its own session history.
  # Channels listed in free_response_channels or no_thread_channels bypass
  # this and get inline replies instead.
  auto_thread: true

  # Bot reaction lifecycle (👀 starting → ✅ done / ❌ error). Discord supports
  # additive reactions, so this is enabled by default.
  reactions: true

  # Channel IDs (YAML list or comma-separated string) where the bot NEVER
  # replies, even when @mentioned. Highest priority, overrides everything.
  ignored_channels: []

  # Channel IDs where the bot answers inline instead of auto-threading.
  no_thread_channels: []

  # Channel IDs where the bot answers without needing an @mention. Auto-
  # threading is skipped here so the channel stays a lightweight chat.
  # Override at runtime via env DISCORD_FREE_RESPONSE_CHANNELS.
  free_response_channels: ""

  # Per-channel ephemeral system prompts (channel_id → prompt text).
  # channel_prompts: {}

  # Safe defaults — LLMs can easily produce the literal string "@everyone"
  # in a normal-looking response. Leaving everyone/roles at false prevents
  # accidental mass-pings.
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

# ─────────────────────────────────────────────────────────────────────────
# Gateway-level platform extras — allowlists, link-preview control,
# streaming transport, slash-command admin tiers. The nested
# gateway.platforms.<name>.extra path matches the upstream schema for
# `allow_from`, `group_allowed_chats`, `disable_link_previews`, etc.
# ─────────────────────────────────────────────────────────────────────────
gateway:
  # Token-by-token streaming on messaging platforms. Disabled by default —
  # flip on once you've validated your provider. transport: auto picks
  # Telegram's native draft API on DMs (smooth) and falls back to
  # editMessageText polling elsewhere.
  streaming:
    enabled: false
    transport: auto    # auto | draft | edit | off

  # Tool-call progress messages in chat ("Running terminal command...").
  # off | new (only the first per turn) | all | verbose
  display:
    tool_progress: all
    tool_progress_command: false

  platforms:
    telegram:
      extra:
        # Suppress Telegram's auto-generated URL previews on bot replies.
        disable_link_previews: false

        # Config-file allowlists — layer with the env-var allowlists.
        # allow_from:            ["123456789"]            # DMs + groups
        # group_allow_from:      ["987654321"]            # groups only
        # group_allowed_chats:   ["-1001234567890"]       # any member of the chat

        # Slash-command admin tiering. Only set if you split admins from
        # non-admin allowed users.
        # allow_admin_from:      ["123456789"]
        # user_allowed_commands: ["status", "model", "history"]

    discord:
      extra:
        # If you run multiple Hermes gateways against the same Discord app
        # (e.g. staging + prod), set this to false on the follower so only
        # the primary owns global slash-command registration.
        slash_commands: true

        # Config-file allowlist (alternative to DISCORD_ALLOWED_USERS env).
        # allow_from:            ["123456789012345678"]

        # Slash-command admin tiering.
        # allow_admin_from:      ["123456789012345678"]
        # user_allowed_commands: ["status", "model", "history"]

# ─────────────────────────────────────────────────────────────────────────
# Terminal tool — runs commands inside this container.
# ─────────────────────────────────────────────────────────────────────────
terminal:
  backend: "local"
  cwd: "."
  timeout: 180
  lifetime_seconds: 300
  docker_mount_cwd_to_workspace: false
